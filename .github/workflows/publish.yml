name: Publish

# Builds the binaries once, attaches them to a GitHub release, and packs the
# Linux ones into a multi-arch image. Runs on a pushed tag, from release.yml
# after it creates one, or by hand for an existing tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing tag to publish, e.g. v0.1.0.
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: Tag to publish, e.g. v0.1.0.
        required: true
        type: string

permissions: {}

env:
  BIN: mcp-cli
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, arch: amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, arch: arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin "$BIN"

      - name: Package
        run: |
          set -euo pipefail
          name="$BIN-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$BIN" README.md "dist/$name/"
          [ -f LICENSE ] && cp LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          if [ -n "${{ matrix.arch }}" ]; then
            mkdir -p "image/${{ matrix.arch }}"
            cp "target/${{ matrix.target }}/release/$BIN" "image/${{ matrix.arch }}/"
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

      - name: Upload image binary
        if: matrix.arch != ''
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: image/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* --verify-tag --generate-notes --title "$VERSION"
          fi

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - name: Download image binaries
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: image
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x image/*/"$BIN"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: image
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
